name: Deploy Pages

# ADR-003: a single GitHub Pages site serves both apps — apps/public at the
# root ('/') and apps/backoffice under a subpath ('/backoffice/'). This
# workflow builds both with Vite, combines their dist/ output into one
# artifact (with a per-app 404.html SPA fallback), and publishes it with
# actions/deploy-pages. It never touches worker/ (see deploy-worker.yml).
on:
  push:
    branches: [main]
    paths-ignore:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build both apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Matches deploy-worker.yml / local dev (v24.21.0) — Node 20 is
          # being deprecated on GitHub-hosted runners and worker/'s wrangler
          # already requires >=22, so both workflows track the same version.
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      # GitHub Pages serves this repo as a *project* page (its name isn't
      # `<owner>.github.io` and no custom domain is configured — see
      # docs/deploy/RUNBOOK.md), so the site itself lives under `/<repo>/`,
      # not the domain root. Both apps' vite.config.js read this as
      # `BASE_PATH` and fall back to `/` when it's unset (plain local dev).
      # Computed from the actual repo name (not hardcoded) so a future
      # rename — CLAUDE.md flags the current name as provisional — needs no
      # edit here.
      - name: Resolve GitHub Pages base path
        id: base
        run: echo "path=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      # ADR-004 superseded ADR-001's "Frontend público no consume el Worker en
      # absoluto": apps/public now signs every upload through the Worker's
      # `/upload/sign` route (Turnstile-gated), replacing the old unsigned
      # upload-preset flow — so it needs VITE_WORKER_BASE_URL (same Worker URL
      # already used by apps/backoffice below) and the new, still-empty
      # VITE_TURNSTILE_SITE_KEY (public site key, not the Turnstile secret —
      # that one is a Worker-only secret, see deploy-worker.yml). Cloud name
      # is already known/non-secret (see CLAUDE.md "Estado actual"); the
      # `vars.*` lookup lets the repo override any of these later without
      # editing this file. VITE_CLOUDINARY_UPLOAD_PRESET is gone: ADR-004
      # removes the unsigned-upload code path entirely, so that var is no
      # longer read by anything (the Cloudinary upload preset itself should
      # also be disabled/deleted on Cloudinary's side — see this task's
      # final report).
      - name: Build apps/public
        working-directory: apps/public
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ vars.VITE_CLOUDINARY_CLOUD_NAME || 'yl7b8vmh' }}
          VITE_WORKER_BASE_URL: ${{ vars.VITE_WORKER_BASE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: npm run build

      # apps/backoffice needs the repo (known), the OAuth App's client_id and
      # the Worker's public URL — the latter two don't exist yet (see
      # docs/deploy/RUNBOOK.md): they come from GitHub Actions "variables"
      # (Settings > Secrets and variables > Actions > Variables tab, NOT
      # secrets — neither value is sensitive) that the user fills in once
      # both prerequisites are deployed. Until then this builds with them
      # empty, matching each composable's own `isConfigured` guard (shows a
      # "missing config" message instead of crashing).
      - name: Build apps/backoffice
        working-directory: apps/backoffice
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
          VITE_GITHUB_REPO: ${{ vars.VITE_GITHUB_REPO || github.repository }}
          VITE_GITHUB_OAUTH_CLIENT_ID: ${{ vars.VITE_GITHUB_OAUTH_CLIENT_ID }}
          VITE_WORKER_BASE_URL: ${{ vars.VITE_WORKER_BASE_URL }}
        run: npm run build

      # Combine both dist/ into one artifact: public app at the root,
      # backoffice under /backoffice/. GitHub Pages serves ONLY a single
      # root 404.html for the whole site (verified: nested 404.html files
      # under a subpath are never used, unlike Netlify-style hosts) — so a
      # per-app 404.html copy would silently never fire for /backoffice/**
      # deep links. docs/deploy/404.html is a small shared script that
      # inspects the URL to tell which of the two apps it belongs to and
      # redirects to THAT app's own index.html; each app's index.html then
      # restores the real path (inline script) before its Vue Router boots.
      - name: Combine build output
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/backoffice
          cp -r apps/public/dist/. site/
          cp -r apps/backoffice/dist/. site/backoffice/
          touch site/.nojekyll
          cp docs/deploy/404.html site/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
