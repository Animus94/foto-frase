name: Deploy Worker

# ADR-001/ADR-003: worker/ is a separate Cloudflare Worker, not part of the
# Vite/GitHub Pages build. It has its own pipeline, triggered only by
# changes under worker/** (or manually), so unrelated app changes never
# redeploy it.
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # wrangler 4.142.0 (worker/package.json) requires Node >=22 — hit
          # in CI, confirmed locally too (this repo's dev Node is v24.21.0).
          node-version: 24

      - name: Install worker dependencies
        working-directory: worker
        run: npm install

      - name: Type-check worker
        working-directory: worker
        run: npm run typecheck

      # cloudflare/wrangler-action@v4's own `wranglerVersion` pinning didn't
      # take effect in practice (its internal install kept resolving
      # wrangler@4.86.0 regardless — an ERESOLVE conflict against the
      # ^5.x @cloudflare/workers-types already required by
      # worker/package.json, ran and confirmed twice). Using our own
      # `npx wrangler`, already installed by "Install worker dependencies"
      # above at the exact version worker/package.json pins (verified
      # locally: clean install + `wrangler deploy --dry-run`), removes that
      # third-party action's version-resolution behavior from the deploy
      # path entirely instead of continuing to fight it blind.
      #
      # CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID as env vars are wrangler's
      # own documented non-interactive auth mechanism (no `wrangler login`
      # needed in CI). `wrangler secret bulk` (no filename argument) reads a
      # JSON object of secrets from stdin — confirmed via `wrangler secret
      # bulk --help` — so these values never touch a shell command line or a
      # temp file, only piped stdin built from `env:` below.
      #
      # TURNSTILE_SECRET_KEY (ADR-004) follows the exact same pattern as the
      # two Cloudinary secrets — it doesn't exist as a GitHub Actions secret
      # yet (see docs/deploy/RUNBOOK.md's new Turnstile step): until the user
      # creates it there, this resolves to an empty string and `wrangler
      # secret bulk` sets it to that, same as any other not-yet-configured
      # secret in this repo.
      - name: Set Cloudinary/Turnstile secrets on the Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          node -e '
            process.stdout.write(JSON.stringify({
              CLOUDINARY_API_KEY: process.env.CLOUDINARY_API_KEY,
              CLOUDINARY_API_SECRET: process.env.CLOUDINARY_API_SECRET,
              TURNSTILE_SECRET_KEY: process.env.TURNSTILE_SECRET_KEY,
            }));
          ' | npx wrangler secret bulk

      - name: Deploy worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
