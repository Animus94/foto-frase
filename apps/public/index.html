<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-64x64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#358e3d" />
    <meta
      name="description"
      content="Sumá tu selfie o foto con una frase de adhesión al Mural de la 5ta Marcha Federal Universitaria."
    />
    <title>Mural — 5ta Marcha Federal Universitaria</title>
    <script>
      // Restores the real deep-linked path after the site-root 404.html
      // redirect (docs/deploy/404.html, copied by deploy-pages.yml) — must
      // run before Vue Router reads the URL on boot (router.js).
      ;(function () {
        var original = new URLSearchParams(window.location.search).get('p')
        if (original) window.history.replaceState(null, '', original)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
